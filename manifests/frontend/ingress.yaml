apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: documind-ingress
  namespace: documind
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: documind.qossim005.online
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: documind-backend
                port:
                  number: 3002
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: documind-frontend
                port:
                  number: 80
          - path: /grafana(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: grafana-proxy
                port:
                  number: 80