apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: documind-frontend
  namespace: documind
spec:
  replicas: 2
  selector:
    matchLabels:
      app: documind-frontend
  strategy:
    canary:
      steps:
        - setWeight: 25
        - pause: { duration: 30s }
        - setWeight: 50
        - pause: { duration: 30s }
        - setWeight: 100
  template:
    metadata:
      labels:
        app: documind-frontend
    spec:
      containers:
        - name: frontend
          image: 332130072211.dkr.ecr.us-east-1.amazonaws.com/documind-frontend:641a46760b322a551ab7a1f12f860d753d1728da
          ports:
            - containerPort: 80
