# Reuses the same GEMINI_API_KEY stored for the backend - one Gemini key
# for the whole app, just projected into a second Secret for this workload.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: documind-agent-secrets
  namespace: documind
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: documind-agent-secrets
    creationPolicy: Owner
  data:
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: documind-dev-backend-secrets
        property: GEMINI_API_KEY
