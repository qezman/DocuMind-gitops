apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: documind-agent
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/qezman/documind-gitops.git
    targetRevision: main
    path: manifests/agent
  destination:
    server: https://kubernetes.default.svc
    namespace: documind
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # No CreateNamespace=true here - see apps/backend.yaml for why: the
    # "documind" Namespace is owned solely by documind-frontend's
    # manifests/frontend/namespace.yaml.
