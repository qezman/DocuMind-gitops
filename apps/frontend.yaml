apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: documind-frontend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/qezman/documind-gitops.git
    targetRevision: main
    path: manifests/frontend
  destination:
    server: https://kubernetes.default.svc
    namespace: documind
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true